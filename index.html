<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0d1a25" />
    <meta name="description" content="Boje Casino: Chicken Road, Crash, 3D Slots, Blackjack and more, played with free coins." />
    <title>Boje Casino</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 2.6 27.6 9.3v13.4L16 29.4 4.4 22.7V9.3Z' fill='%231fd172' stroke='%231fd172' stroke-width='2.6' stroke-linejoin='round'/%3E%3Cpath d='M10.3 8.5h6.4c3.1 0 5 1.55 5 4 0 1.5-.8 2.6-2.1 3.1 1.75.5 2.75 1.85 2.75 3.65 0 2.7-2.1 4.25-5.4 4.25H10.3Zm3.4 2.7v3.4h2.6c1.2 0 1.9-.62 1.9-1.7s-.7-1.7-1.9-1.7Zm0 6.1v3.6h2.9c1.35 0 2.15-.68 2.15-1.8s-.8-1.8-2.15-1.8Z' fill='%2304260f' fill-rule='evenodd'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Press+Start+2P&display=swap" rel="stylesheet" />
    <style>
      /* Boje boot screen: shown until the app has drawn its first frame (main.tsx fades it out). The same faceted
         gem as components/Loader.tsx: a soft light travels round the six facets, one turn every 2.4 s. */
      #boot {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(ellipse at 50% 40%, #13283b 0%, #0d1a25 64%);
        color: #eef4f9;
        font-family: Manrope, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
        transition: opacity 0.4s ease, visibility 0.4s;
      }
      #boot.gone {
        opacity: 0;
        visibility: hidden;
      }
      #boot .bj {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
      }
      #boot .gem {
        width: 72px;
        height: 72px;
        filter: drop-shadow(0 12px 26px rgba(8, 110, 62, 0.32));
      }
      #boot .lit {
        opacity: 0;
        animation: bj-facet 2.4s ease-in-out infinite;
      }
      #boot .word {
        display: flex;
        align-items: baseline;
        gap: 6px;
        line-height: 1;
      }
      #boot .word b {
        font-size: 24px;
        font-weight: 800;
        letter-spacing: -0.045em;
      }
      #boot .word i {
        font-style: normal;
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        color: #22d36f;
      }
      @keyframes bj-facet {
        0%,
        100% {
          opacity: 0;
        }
        16% {
          opacity: 1;
        }
        48% {
          opacity: 0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot .lit {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="boot" role="status" aria-label="Loading Boje Casino">
      <div class="bj">
        <svg class="gem" viewBox="0 0 32 32" aria-hidden="true">
          <defs>
            <linearGradient id="bjg" gradientUnits="userSpaceOnUse" x1="7" y1="3" x2="25" y2="29">
              <stop offset="0" stop-color="#5ff5a6" />
              <stop offset=".55" stop-color="#1fd172" />
              <stop offset="1" stop-color="#0c8d49" />
            </linearGradient>
          </defs>
          <path d="M16.27 15.53L16.27 3.07L27.06 9.30Z" fill="url(#bjg)" />
          <path d="M16.54 16.00L27.33 9.77L27.33 22.23Z" fill="url(#bjg)" />
          <path d="M16.27 16.47L27.06 22.70L16.27 28.93Z" fill="url(#bjg)" />
          <path d="M15.73 16.47L15.73 28.93L4.94 22.70Z" fill="url(#bjg)" />
          <path d="M15.46 16.00L4.67 22.23L4.67 9.77Z" fill="url(#bjg)" />
          <path d="M15.73 15.53L4.94 9.30L15.73 3.07Z" fill="url(#bjg)" />
          <path d="M16.27 15.53L16.27 3.07L27.06 9.30Z" fill="#fff" opacity="0.2" />
          <path d="M16.54 16.00L27.33 9.77L27.33 22.23Z" fill="#fff" opacity="0.06" />
          <path d="M15.46 16.00L4.67 22.23L4.67 9.77Z" fill="#fff" opacity="0.05" />
          <path d="M15.73 15.53L4.94 9.30L15.73 3.07Z" fill="#fff" opacity="0.16" />
          <path class="lit" d="M16.27 15.53L16.27 3.07L27.06 9.30Z" fill="#fff" fill-opacity=".38" />
          <path class="lit" d="M16.54 16.00L27.33 9.77L27.33 22.23Z" fill="#fff" fill-opacity=".38" style="animation-delay: 0.4s" />
          <path class="lit" d="M16.27 16.47L27.06 22.70L16.27 28.93Z" fill="#fff" fill-opacity=".38" style="animation-delay: 0.8s" />
          <path class="lit" d="M15.73 16.47L15.73 28.93L4.94 22.70Z" fill="#fff" fill-opacity=".38" style="animation-delay: 1.2s" />
          <path class="lit" d="M15.46 16.00L4.67 22.23L4.67 9.77Z" fill="#fff" fill-opacity=".38" style="animation-delay: 1.6s" />
          <path class="lit" d="M15.73 15.53L4.94 9.30L15.73 3.07Z" fill="#fff" fill-opacity=".38" style="animation-delay: 2.0s" />
          <path d="M10.3 8.5h6.4c3.1 0 5 1.55 5 4 0 1.5-.8 2.6-2.1 3.1 1.75.5 2.75 1.85 2.75 3.65 0 2.7-2.1 4.25-5.4 4.25H10.3Zm3.4 2.7v3.4h2.6c1.2 0 1.9-.62 1.9-1.7s-.7-1.7-1.9-1.7Zm0 6.1v3.6h2.9c1.35 0 2.15-.68 2.15-1.8s-.8-1.8-2.15-1.8Z" fill="#04260f" fill-rule="evenodd" />
        </svg>
        <div class="word" aria-hidden="true"><b>boje</b><i>casino</i></div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
